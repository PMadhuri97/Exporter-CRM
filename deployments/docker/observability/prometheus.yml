# Prometheus scrape configuration for the Business Platform.
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    platform: aner-settlement

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # Application business + HTTP metrics (scraped directly from the app).
  - job_name: aner-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: aner-settlement-platform

  # OpenTelemetry Collector internal metrics (pipeline health).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Prometheus self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
