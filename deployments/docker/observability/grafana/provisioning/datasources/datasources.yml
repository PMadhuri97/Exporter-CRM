# Auto-provisioned Grafana datasources — Prometheus (metrics) + Jaeger (traces).
# Fixed uids so dashboard JSON can reference them deterministically.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
