# Tell Grafana to load dashboard JSON from the mounted folder.
apiVersion: 1

providers:
  - name: aner-dashboards
    orgId: 1
    folder: "Business"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
