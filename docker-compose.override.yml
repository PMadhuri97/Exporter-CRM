# Disables OpenTelemetry instrumentation, which `docker-compose.yml` turns on.
#
# Why: with `OTEL_ENABLED: "true"`, *every* request 500s in middleware, before
# any route runs:
#
#   opentelemetry/instrumentation/fastapi/__init__.py, _get_route_details
#     route = starlette_route.path
#   AttributeError: '_IncludedRouter' object has no attribute 'path'
#
# `opentelemetry-instrumentation-fastapi==0.57b0` assumes every route exposes
# `.path`, but `fastapi==0.141.0` / `starlette==1.3.1` wrap included routers in
# a private `_IncludedRouter` (see app/platform/middleware/services.py:338).
# This is a pinned-dependency incompatibility, not application code. The real
# fix is upgrading that package and rebuilding the image; turning the
# instrumentation off is the stopgap that makes the API usable meanwhile.
#
# The previous version of this file also redirected the app to `aner_test`,
# because `aner_settlement` was stamped at `onboarding_0012_risk_critical` and
# missing the columns `auth_0003_user_admin` / `auth_0004_rbac` add, so every
# login failed with `UndefinedColumnError`. `aner_settlement` has since been
# dropped, recreated and migrated to head, so that redirect is gone.

services:
  app:
    environment:
      OTEL_ENABLED: "false"
