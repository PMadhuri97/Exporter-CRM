# Architectural boundary contracts — ARCHITECTURE.md §2, enforced in CI (§11).
#
#         api/
#           |
#           v
#       modules/  --------->  integrations/
#           |                       |
#           v                       v
#    platform/  shared/      platform/  shared/
#
# "Any import that violates the above is a build failure, not a code-review comment."
#
# app.bootstrap is the composition root: it wires every module into the app and is
# the one place permitted to know everything. It is excluded from `root_packages`
# analysis targets below by being explicitly ignored in the contracts that would
# otherwise flag it.

[importlinter]
root_packages =
    app
include_external_packages = False


[importlinter:contract:foundation-is-independent]
name = platform and shared depend on nothing above them
type = forbidden
source_modules =
    app.platform
    app.shared
forbidden_modules =
    app.modules
    app.integrations
    app.api


[importlinter:contract:shared-is-pure]
name = shared depends on nothing inside app at all
type = forbidden
source_modules =
    app.shared
forbidden_modules =
    app.platform
    app.modules
    app.integrations
    app.api


[importlinter:contract:integrations-never-import-modules]
name = integrations never import a module (ARCHITECTURE.md §2)
type = forbidden
source_modules =
    app.integrations
forbidden_modules =
    app.modules
    app.api


[importlinter:contract:modules-never-import-api]
name = modules never import the delivery layer
type = forbidden
source_modules =
    app.modules
forbidden_modules =
    app.api


# ─────────────────────────────────────────────────────────────────────────────
# Module dependency CYCLES are enforced in tests/contract/test_module_independence.py,
# NOT here. This is deliberate, and it is a limitation of the tool, not an omission.
#
# import-linter offers three contract types, and none of them expresses acyclicity:
#
#   forbidden     cannot see a cycle at all. Every edge in a cycle may be individually
#                 legal -- which is exactly how `compliance <-> orchestration` passed all
#                 16 contracts (VERIFICATION_REPORT.md HIGH-1).
#   independence  forbids edges in BOTH directions between the named modules. But
#                 `orchestration -> compliance`, `orchestration -> payments` and
#                 `settlement -> ledger` are legitimate and intended (§2 permits a module
#                 to import another's facade). An independence contract across the
#                 business modules would be broken by design, on day one, by correct code.
#   layers        WOULD express acyclicity correctly, by forcing a strict ordering. It
#                 cannot be added yet: no valid layering exists while the
#                 {audit, compliance, fx, ledger, orchestration, payments, settlement}
#                 SCC remains. Add a layers contract here the moment that SCC is broken --
#                 that is the right permanent home for this rule.
#
# Until then, a Tarjan SCC analysis in the test suite is the only check that actually
# answers the question. It is a ratchet: the known SCC is enumerated, and any new or
# enlarged cycle fails the build.
# ─────────────────────────────────────────────────────────────────────────────

[importlinter:contract:audit-internals-are-private]
name = audit: other modules may import only the public facade
type = forbidden
# A facade imports its own internals, so every facade import reaches them
# indirectly. Only a DIRECT import of another module's internals is a violation.
allow_indirect_imports = True
source_modules =
    app.modules.compliance
    app.modules.customers
    app.modules.fx
    app.modules.ledger
    app.modules.notifications
    app.modules.onboarding
    app.modules.orchestration
    app.modules.payments
    app.modules.reconciliation
    app.modules.reporting
    app.modules.settlement
    app.modules.rails
    app.modules.kyb
    app.modules.cases
forbidden_modules =
    app.modules.audit.api
    app.modules.audit.application
    app.modules.audit.config
    app.modules.audit.constants
    app.modules.audit.domain
    app.modules.audit.events
    app.modules.audit.exceptions
    app.modules.audit.infrastructure
    app.modules.audit.migrations
    app.modules.audit.tests
    app.modules.audit.workflows

