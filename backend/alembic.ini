[alembic]
script_location = migrations
# ARCHITECTURE.md §4: migrations/ is a RUNNER. Domain schema is owned by the
# domain; only platform-level / cross-domain migrations live in migrations/versions.
#
# EVERY app/modules/*/migrations/ directory must be listed here, including the empty
# ones. A directory that exists but is unlisted is silently ignored by
# `alembic upgrade head` -- schema drift behind a green build (VERIFICATION_REPORT.md
# MED-4). Five were unlisted before this was fixed.
#
# This list is explicit rather than globbed because Alembic resolves version_locations
# in ScriptDirectory.from_config(), which runs BEFORE migrations/env.py. Discovery
# performed in env.py is invisible to `alembic heads`, `history` and `current`, which
# never execute env.py at all -- doing it there breaks head resolution outright
# (KeyError on the first cross-directory down_revision). Completeness is therefore
# enforced by tests/contract/test_migration_discovery.py, which derives the expected
# list from the filesystem and fails the build when a module migrations directory is
# added without being registered here.
#
# Keep this on ONE line. Alembic splits version_locations with the regex ", *|(?: +)"
# -- commas and spaces only, never newlines -- so an indented multi-line list silently
# resolves to zero valid locations and `alembic upgrade head` applies nothing.
version_locations = migrations/versions app/modules/audit/migrations app/modules/cases/migrations app/modules/compliance/migrations app/modules/customers/migrations app/modules/fx/migrations app/modules/gateway/migrations app/modules/ledger/migrations app/modules/notifications/migrations app/modules/onboarding/migrations app/modules/payments/migrations app/modules/rails/migrations app/modules/reconciliation/migrations app/modules/reporting/migrations app/modules/settlement/migrations app/platform/authentication/migrations app/platform/idempotency/migrations app/platform/messaging/migrations
prepend_sys_path = .

# Overridden at runtime by alembic/env.py reading from app.config
sqlalchemy.url = postgresql+psycopg2://aner:aner@localhost:5432/aner_settlement

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
