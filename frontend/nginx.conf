# HSTS only for a request that reached the load balancer over HTTPS (it terminates TLS
# and says so in X-Forwarded-Proto). Over plain HTTP the value is empty and nginx sends
# no header, so this is safe before the HTTPS listener exists and switches on with it.
map $http_x_forwarded_proto $hsts_header {
    https   "max-age=31536000";
    default "";
}

server {
    listen 80;
    server_name _;

    # No version in the Server header or on error pages.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Health check endpoint for container/ALB
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy\n';
    }

    # Security headers (CSP, nosniff, frame and referrer policy, HSTS over HTTPS).
    # Repeated in every location that sets its own headers: nginx does not inherit
    # `add_header` into a location that has any of its own.
    include /etc/nginx/snippets/security-headers.conf;

    # SPA routing: all client routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|gif|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # ES modules (the PDF viewer's pdf.js worker is `pdf.worker.min-<hash>.mjs`). nginx's
    # stock mime.types maps only `.js`, so without this an `.mjs` file is served as
    # application/octet-stream and the browser refuses to run it as a module worker —
    # every PDF preview would fail. `types {}` empties the map here so `default_type`
    # applies to the whole location.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Not content-hashed like the bundle, so it must not get the year-long immutable
    # cache the asset rule below would give any other .js file.
    location = /theme-init.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Disable caching for index.html so updates load immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/snippets/security-headers.conf;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
