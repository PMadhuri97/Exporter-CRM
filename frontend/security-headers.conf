# Browser hardening headers, included in the server block and again in every location
# that sets headers of its own: nginx does not inherit `add_header` into a location
# that has any of its own.
#
# Content-Security-Policy — the app is a bundle served from this origin and talks only
# to /api on this origin, so everything is 'self' except:
#   style-src 'unsafe-inline'  toast and popover libraries inject <style> at run time;
#                              inline *style* cannot run script.
#   blob: (img, connect, worker, frame)  documents are fetched with the session and
#                              shown from a blob: URL; pdf.js reads the PDF from one.
#   data: (img, font)          small inlined icons and pdf.js's embedded fonts.
# No inline or third-party *script* is allowed at all, so injected markup cannot run
# code — the defence that matters most while the refresh token is in localStorage.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Only over HTTPS: see the $hsts_header map in nginx.conf.
add_header Strict-Transport-Security $hsts_header always;
